<div id="search-modal">
  <div id="search-modal-content">
    <label for="search-input" class="visually-hidden">{{< translate key="search" default="Search" language_strings={language_strings} lang={lang} />}}</label>
    <div>
      <input id="search-input" placeholder="{{< translate key='search_placeholder' default='Search for…' language_strings={language_strings} lang={lang} />}}" autocomplete="off" type="search">
      <div title="{{< translate key='search_shortcut' default='Press “/” to Open Search Bar' language_strings={language_strings} lang={lang} />}}">
        {{< icon name="keyboard" />}}
      </div>
    </div>
    <div id="search-results" class="overshoot"></div>
  </div>
</div>
